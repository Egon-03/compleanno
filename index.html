<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ef">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Per Lalla 🤍</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c9848f' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="petals" aria-hidden="true"></div>

  <header id="progress" aria-label="Avanzamento" hidden></header>

  <main id="app" aria-live="polite"></main>

  <footer id="footer">
    <span id="footer-before"></span>
    <button id="footer-heart" type="button" aria-label="Cuore">🤍</button>
    <span id="footer-after"></span>
  </footer>

  <!-- Unico elemento audio, riutilizzato per tutti i brani -->
  <audio id="audio" preload="metadata" playsinline webkit-playsinline></audio>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="games/wordle.js"></script>
  <script src="games/memory.js"></script>
  <script src="games/numbers.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
