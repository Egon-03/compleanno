<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=block">
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 210mm; height: 297mm; padding-top: 22mm; background: #fff; font-family: 'Inter', sans-serif;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.row { display: flex; justify-content: center; gap: 10mm; }
svg.tag { width: 58mm; height: 58mm; overflow: visible; }
.hint { text-align: center; margin-top: 8mm; font-size: 3.1mm; color: #a8979a; }
.serif { font-family: 'Playfair Display', Georgia, serif; }
.script { font-family: 'Caveat', cursive; }
.num { font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; }
</style></head><body>
<div class="row" id="row"></div>
<p class="hint">✂ Ritaglia lungo il bordo dorato e incolla sopra il pacco (colla stick o biadesivo)</p>
<script>
const S = 58, c = 29;
const heart = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
const arc = (r, sweep) => `M${c - r},${c} A${r},${r} 0 0 ${sweep} ${c + r},${c}`;
function tag(n) {
  const id = 't' + n;
  return `<svg class="tag" viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="${id}bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbecef"/><stop offset=".55" stop-color="#fdf8f1"/><stop offset="1" stop-color="#f5e9d2"/></linearGradient>
    <linearGradient id="${id}gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8cf92"/><stop offset=".5" stop-color="#bf974b"/><stop offset="1" stop-color="#e4cb8c"/></linearGradient>
    <pattern id="${id}pat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="${heart}" transform="translate(1.2 1.2) scale(.1)" fill="#c9848f" opacity=".15"/>
      <path d="${heart}" transform="translate(5.3 5.3) scale(.075)" fill="#c9a961" opacity=".22"/>
    </pattern>
    <radialGradient id="${id}glow"><stop offset="0" stop-color="#fffdf9" stop-opacity=".95"/><stop offset=".7" stop-color="#fffdf9" stop-opacity=".8"/><stop offset="1" stop-color="#fffdf9" stop-opacity="0"/></radialGradient>
    <path id="${id}top" d="${arc(21.6, 1)}"/>
    <path id="${id}bot" d="${arc(24.4, 0)}"/>
  </defs>
  <circle cx="${c}" cy="${c}" r="28.6" fill="url(#${id}bg)"/>
  <circle cx="${c}" cy="${c}" r="28.6" fill="url(#${id}pat)"/>
  <circle cx="${c}" cy="${c}" r="28.6" fill="none" stroke="url(#${id}gold)" stroke-width="1"/>
  <circle cx="${c}" cy="${c}" r="26.6" fill="none" stroke="#c9a961" stroke-width=".25"/>
  <circle cx="${c}" cy="${c}" r="20" fill="url(#${id}glow)"/>
  <text font-family="Inter" font-weight="600" font-size="2.5" letter-spacing=".75" fill="#b06775">
    <textPath href="#${id}top" startOffset="50%" text-anchor="middle">✦ SORPRESA ✦</textPath></text>
  <text font-family="Inter" font-weight="500" font-size="2.05" letter-spacing=".15" fill="#8a7277">
    <textPath href="#${id}bot" startOffset="50%" text-anchor="middle">aprimi solo quando te lo dice il sito</textPath></text>
  <text x="${c}" y="17.6" text-anchor="middle" class="serif" font-style="italic" font-weight="500" font-size="3.4" fill="#b06775">pacco nº</text>
  <text x="${c + .3}" y="38.4" text-anchor="middle" class="serif num" font-weight="700" font-size="21" fill="#6b1e2e">${n}</text>
  <text x="${c}" y="45" text-anchor="middle" class="script" font-weight="700" font-size="5.4" fill="#8a2f45">Per Lalla</text>
  <path d="${heart}" transform="translate(${c - 1.15} 46.2) scale(.095)" fill="#c9848f"/>
</svg>`;
}
document.getElementById('row').innerHTML = [1,2,3].map(tag).join('');
</script>
</body></html>
